# navigateur configuration. Colours are plain hex. Edit this file, or press `,`
# in the browser -- it patches the one line it changes and leaves the rest be.

[colors]
accent      = "#fe8019"   # the caret, the active root
dir         = "#83a598"
file        = "#ebdbb2"
dim         = "#928374"   # hints, counts, disclosure triangles
border      = "#504945"
selected_bg = "#3c3836"

[behavior]
show_hidden    = false
follow_default = false   # start this window as the leader

[keys]
# One key per action. Press `,` in the browser to change these.
down           = "j"
up             = "k"
enter          = "l"
leave          = "h"
top            = "g"
bottom         = "G"
open           = "o"
reveal         = "O"
window         = "w"
tab            = "t"
hidden         = "."
mark           = "e"
op_move        = "m"
op_copy        = "c"
op_cut         = "x"
op_delete      = "d"
bookmark_set   = "B"
bookmark_go    = "b"
lead           = "F"
follow         = "f"
panel_keys     = "?"
panel_settings = ","
